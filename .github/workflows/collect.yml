name: NAKAMURA LAB price snapshots
on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nakamura-price-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch completed OHLC bars and save archive
        run: python scripts/collect.py
      - name: Commit changed archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/background.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: backfill USDJPY OHLC and monitor freshness'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
